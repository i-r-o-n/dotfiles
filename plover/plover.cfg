[System]
# pick no gui
gui = none
# engine options
enable = true
start_translations = true

[Output]
# send keystrokes through Linux uinput (works wayland-native)
output = uinput

[Uinput]
# tweak if needed — common set works fine
keymap = qwerty
layout = us

[Machine]
machine_type = Keyboard
layout = qwerty
